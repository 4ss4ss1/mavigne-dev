<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La démo de Ma Vigne — un domaine, quatre téléphones</title>
<meta name="description" content="Trois minutes sur les vrais écrans de Ma Vigne : ce que voient le gérant, l’ouvrier, le tractoriste et le maître de chai, au domaine.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#14100C">
<meta property="og:type" content="website">
<meta property="og:title" content="La démo de Ma Vigne — un domaine, quatre téléphones">
<meta property="og:description" content="De la parcelle au registre, sans rien ressaisir. Trois minutes sur les vrais écrans.">
<meta property="og:url" content="https://mavigneapp.fr/demo.html">
<meta property="og:image" content="https://mavigneapp.fr/og-mavigne.png">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#F2EBDF; --fg:#21190F; --fg2:#6A5C49; --accent:#8A6719; --gold:#B8912F;
  --card:rgba(70,48,14,.05); --cardb:rgba(70,48,14,.15); --btn:#21190F; --btnfg:#F3ECDF;
  --bezel:#17120D; --ok:#4E7A2E; --skyA:.55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14100C; --fg:#EFE6D4; --fg2:#B5A88F; --accent:#D9BE73; --gold:#C9A84C;
    --card:rgba(255,246,226,.055); --cardb:rgba(232,214,166,.16); --btn:#D9BE73; --btnfg:#1B140C;
    --bezel:#0A0806; --ok:#8DBA63; --skyA:1;
  }
}
:root[data-theme="dark"]{
  --bg:#14100C; --fg:#EFE6D4; --fg2:#B5A88F; --accent:#D9BE73; --gold:#C9A84C;
  --card:rgba(255,246,226,.055); --cardb:rgba(232,214,166,.16); --btn:#D9BE73; --btnfg:#1B140C;
  --bezel:#0A0806; --ok:#8DBA63; --skyA:1;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.sky{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.sky.on{opacity:var(--skyA)}

/* barre du haut */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 16px 6px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;cursor:pointer;flex-shrink:0}
.brand img{width:28px;height:28px;object-fit:contain}
.brand span{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:.2px}
.prog{flex:1;display:flex;gap:5px;min-width:0}
.prog button{flex:1;height:22px;border:0;padding:0;background:none;cursor:pointer;position:relative}
.prog button::before{content:'';position:absolute;left:0;right:0;top:10px;height:3px;border-radius:3px;background:var(--cardb)}
.prog button.done::before{background:color-mix(in srgb,var(--gold) 55%,transparent)}
.prog button.cur::before{background:var(--gold)}
.chap{flex-shrink:0;border:1px solid var(--cardb);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:500;cursor:pointer}

/* scène */
#stage{position:relative;flex:1;min-height:0;z-index:2}
.scene{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:6px 20px 14px;opacity:0;transform:translateX(26px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.scene.in{opacity:1;transform:none}
.scene.out{opacity:0;transform:translateX(-26px)}
.scene.back{transform:translateX(-26px)}
.scene.back.out{transform:translateX(26px)}
.hour{margin:0;font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.2px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(29px,7.6vw,46px);line-height:1.04;letter-spacing:-.2px;margin:4px 0 8px;text-wrap:balance}
.lede{margin:0;font-size:15.5px;line-height:1.5;color:var(--fg2);max-width:46ch;text-wrap:pretty;transition:opacity .3s}
.proof{margin:10px 0 0;font-size:14px;line-height:1.45;padding-left:12px;border-left:2px solid var(--gold);max-width:46ch}
.dev{min-height:0;display:flex;align-items:center;justify-content:center}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.go{border:0;border-radius:15px;padding:14px 22px;background:var(--btn);color:var(--btnfg);font-weight:600;font-size:16px;cursor:pointer;flex:1;max-width:420px;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.go:disabled{opacity:.35;cursor:default;box-shadow:none}
.prev{border:0;background:none;color:var(--fg2);font-size:14.5px;padding:12px 6px;cursor:pointer;flex-shrink:0}
.prompt{flex:1;display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;color:var(--accent)}
.prompt i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 var(--gold);animation:pulse 1.6s infinite;flex-shrink:0}
.skip{border:0;background:none;color:var(--fg2);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;cursor:pointer;padding:10px 4px;flex-shrink:0}

/* appareil */
.phone{position:relative;height:100%;max-height:700px;aspect-ratio:390/844;max-width:100%;border:6px solid var(--bezel);border-radius:32px;background:var(--bezel);box-shadow:0 30px 70px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)}
.screen{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;background:#EFE8DA}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.screen img.after{opacity:0;transition:opacity .55s ease}
.screen.done img.after{opacity:1}
.hot{position:absolute;border:0;background:transparent;border-radius:14px;cursor:pointer;z-index:3}
.hot::after{content:'';position:absolute;inset:-5px;border-radius:16px;border:2.5px solid var(--gold);animation:ring 1.6s ease-in-out infinite}
.screen.done .hot{display:none}
.ring{position:absolute;border:2.5px solid #C9A84C;border-radius:16px;box-shadow:0 0 0 2000px rgba(20,14,8,.18),0 0 24px rgba(201,168,76,.55);pointer-events:none;opacity:0;transition:opacity .6s .35s}
.scene.in .ring{opacity:1}
.ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:rgba(201,168,76,.55);pointer-events:none;animation:rip .7s ease-out forwards;z-index:4}
.laptop{width:min(100%,780px)}
.lscreen{position:relative;aspect-ratio:16/10;border:11px solid var(--bezel);border-bottom-width:13px;border-radius:16px 16px 4px 4px;overflow:hidden;background:#EFE8DA;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.lscreen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.lscreen img.after{opacity:0;transition:opacity .8s ease}
.lscreen.done img.after{opacity:1}
.lbase{height:13px;margin:0 -6%;border-radius:0 0 14px 14px;background:linear-gradient(#2c251d,#120e0a)}

/* la sève */
.s-seve{grid-template-rows:auto auto minmax(0,1fr) auto}
.s-seve .dev{position:relative}
.s-seve .laptop{width:100%}
.rcs{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px 2px 4px}
.rc{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;background:var(--card);border:1px solid var(--cardb);opacity:0;transform:translateY(10px);transition:opacity .45s,transform .5s cubic-bezier(.2,.7,.2,1)}
.rc.on{opacity:1;transform:none}
.rc svg{width:22px;height:22px;flex-shrink:0;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rc div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc b{font-weight:500;font-size:13.5px;color:var(--fg2)}
.rc span{font-size:16px;font-weight:500}
.rc s{color:var(--fg2);text-decoration-thickness:1.5px;font-weight:400}
.rc em{font-style:normal;color:var(--accent);margin:0 4px}
.seve-line{position:absolute;inset:0;pointer-events:none;overflow:visible}
.seve-line path{fill:none;stroke:#C9A84C;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);filter:drop-shadow(0 0 6px rgba(201,168,76,.8))}
.seve-line.run path{animation:draw 1.1s .2s ease-in-out forwards}
.mini-phone{position:absolute;height:62%;aspect-ratio:390/844;left:-10px;bottom:-26px;border:5px solid var(--bezel);border-radius:26px;overflow:hidden;background:var(--bezel);box-shadow:0 20px 50px rgba(0,0,0,.45);display:none}
.mini-phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:21px;display:block}
.replay{border:1px solid var(--cardb);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--fg2)}

/* ouverture : le produit en vedette, comme chez Apple ou Linear */
.s-open{display:flex;flex-direction:column;align-items:center;text-align:center;padding:5vh 20px 0;overflow:hidden}
.op-txt{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.s-open h1{font-size:clamp(40px,11vw,86px);line-height:1;letter-spacing:-.8px;max-width:13ch;margin:0 0 16px}
.s-open .lede{max-width:33ch;font-size:16.5px;margin:0 auto}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 24px;margin-top:24px}
.pill{border:0;border-radius:99px;padding:15px 30px;background:var(--btn);color:var(--btnfg);font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 14px 34px rgba(201,168,76,.26)}
.lien{border:0;background:none;color:var(--accent);font-weight:500;font-size:15.5px;cursor:pointer;padding:10px 2px}
.hero{position:relative;flex:1;min-height:200px;width:100%;max-width:1180px;margin-top:4.5vh}
.hero::before{content:'';position:absolute;left:50%;top:-6%;width:150%;height:115%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(201,168,76,.30),rgba(201,168,76,.09) 55%,transparent 78%);pointer-events:none}
.hero::after{content:'';position:absolute;left:-30px;right:-30px;bottom:0;height:40%;background:linear-gradient(to bottom,transparent,var(--bg) 66%);pointer-events:none;z-index:3}
.h-phone{position:absolute;z-index:2;left:50%;top:0;height:124%;aspect-ratio:390/844;border:7px solid var(--bezel);border-radius:44px;overflow:hidden;background:var(--bezel);box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.09);transform:translate(-50%,46px);opacity:0;transition:transform 1.15s cubic-bezier(.16,.84,.24,1) .3s,opacity .9s ease .3s}
.h-phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;border-radius:37px}
.h-laptop{display:none}
.scene.in .h-phone{transform:translate(-50%,0);opacity:1}
.caption{position:absolute;left:0;right:0;bottom:10px;z-index:4;margin:0;font-size:11.5px;line-height:1.4;color:var(--fg2);padding:0 22px}

/* profil */
.s-prof{display:block;overflow-y:auto;padding-bottom:30px}
.prof-in{max-width:620px;margin:0 auto}
.who{display:grid;gap:10px;margin:18px 0 20px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:15px 17px;border-radius:18px;border:1.5px solid var(--cardb);background:var(--card);cursor:pointer;transition:border-color .2s,background .2s}
.opt b{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;line-height:1.1}
.opt span{font-size:14px;color:var(--fg2)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 13%,transparent)}
.size p{margin:14px 0 8px;font-size:14px;font-weight:500;color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--cardb);background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--btnfg);border-color:transparent}
.s-prof .go{margin-top:24px;width:100%}

/* questions */
.s-q{display:block;overflow-y:auto}
.q-in{max-width:700px;margin:0 auto;padding-bottom:20px}
.qs{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.q{padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--cardb);opacity:0;transform:translateY(10px);transition:opacity .45s,transform .5s cubic-bezier(.2,.7,.2,1)}
.scene.in .q{opacity:1;transform:none}
.q p{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;line-height:1.15}
.q div{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--accent);font-weight:500}
.q button{border:0;background:none;color:var(--fg2);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex-shrink:0;padding:4px 0}

/* fin */
.s-fin{display:block;overflow-y:auto}
.fin-in{max-width:620px;margin:0 auto;padding-bottom:30px}
.fin-prof{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.fin-prof .chips button{padding:6px 11px;font-size:13px}
.bigh{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(76px,22vw,120px);line-height:.9;margin:18px 0 4px;font-variant-numeric:lining-nums tabular-nums}
.bigh small{font-size:.38em;margin-left:6px;color:var(--fg2)}
.bigsub{margin:6px 0 18px;font-size:16px;line-height:1.45}
.lines{display:grid;gap:0;border-top:1px solid var(--cardb)}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--cardb);font-size:14.5px}
.ln b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.ln .vu{grid-column:1/-1;font-size:12.5px;color:var(--fg2)}
.ln .vu button{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px}
.hors{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-size:14px;line-height:1.45;color:var(--fg2);cursor:pointer}
.hors input{width:20px;height:20px;accent-color:#B8912F;flex-shrink:0;margin-top:1px}
.hyp{font-size:12.5px;line-height:1.5;color:var(--fg2);margin:14px 0 0}
.quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:25px;line-height:1.2;margin:26px 0 18px}
.cta{display:block;text-align:center;text-decoration:none;border-radius:15px;padding:15px 20px;background:var(--btn);color:var(--btnfg);font-weight:600;font-size:16px;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.ghost{display:block;width:100%;text-align:center;text-decoration:none;margin-top:9px;border-radius:15px;padding:13px 20px;border:1px solid var(--cardb);background:var(--card);color:var(--fg);font-size:15px;cursor:pointer}
.sign{margin:22px 0 0;font-size:13.5px;color:var(--fg2);line-height:1.5}

/* menu des chapitres */
.menu{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .3s}
.menu.on{opacity:1;pointer-events:auto}
.menu-in{max-width:980px;margin:0 auto}
.menu-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:34px;margin:6px 0 2px}
.menu .x{border:1px solid var(--cardb);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px}
.grp{margin:22px 0 8px;font-size:15px;font-weight:600;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.it{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--cardb);background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer}
.it img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;display:block;background:#EFE8DA}
.it b{font-weight:500;font-size:14px;line-height:1.25;padding:9px 11px 0}
.it span{font-size:12.5px;line-height:1.35;color:var(--fg2);padding:3px 11px 11px}
.it .vu{color:var(--accent)}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.6)}70%{box-shadow:0 0 0 12px rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}
@keyframes ring{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:.55}}
@keyframes rip{to{transform:scale(9);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ordinateur et tablette en largeur */
@media (min-width:920px){
  .bar{padding:16px 34px 8px}
  .scene{grid-template-columns:minmax(320px,440px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:56px;padding:10px 46px 26px}
  .scene .txt{grid-column:1;grid-row:1;align-self:center}
  .scene .dev{grid-column:2;grid-row:1 / span 2}
  .scene .act{grid-column:1;grid-row:2}
  .phone{border-width:11px;border-radius:52px;max-height:calc(100vh - 140px)}
  .screen{border-radius:41px}
  h1{font-size:clamp(40px,4.2vw,58px)}
  .s-seve{grid-template-rows:auto minmax(0,1fr) auto}
  .s-seve .txt{grid-row:1;align-self:end}
  .s-seve .rcs{grid-column:1;grid-row:2;align-self:start;overflow:visible}
  .s-seve .dev{grid-row:1 / span 3;padding:0 30px 30px 60px}
  .s-seve .act{grid-row:3}
  .mini-phone{display:block}
  .s-open{padding:4.5vh 46px 0}
  .s-open h1{font-size:clamp(46px,4.7vw,74px);max-width:21ch}
  .hero{margin-top:4.5vh}
  .h-laptop{display:block;position:absolute;z-index:1;left:50%;top:0;width:min(76%,860px);transform:translate(-50%,56px);opacity:0;transition:transform 1.2s cubic-bezier(.16,.84,.24,1) .12s,opacity 1s ease .12s}
  .scene.in .h-laptop{transform:translate(-50%,0);opacity:1}
  .h-phone{left:auto;right:max(3%,calc(50% - 480px));top:12%;height:108%;transform:translate(0,64px)}
  .scene.in .h-phone{transform:translate(0,0)}
  .s-prof,.s-q,.s-fin{display:block}
}
@media (max-width:919px){
  .s-seve .laptop{max-width:290px;margin:0 auto}
  .s-seve .rc{padding:8px 12px}
  .s-seve .rc span{font-size:15px}
  .s-seve .rc b{font-size:12.5px}
  .s-seve .dev{align-items:flex-start}
}
@media (max-height:700px) and (max-width:919px){
  .s-open{padding-top:2.5vh}
  .s-open h1{font-size:34px;margin-bottom:10px}
  .s-open .lede{font-size:15px}
  .cta-row{margin-top:16px}
  .hero{margin-top:2vh}
  .caption{display:none}
  h1{font-size:27px}
  .lede{font-size:14.5px}
  .proof{display:none}
}

/* ===== Passe 2 : chaque écran au niveau de l'ouverture ===== */
:root{--rim:#bcae9b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rim:#3d3329}}
:root[data-theme="dark"]{--rim:#3d3329}
.go,.pill,.cta{border-radius:99px;box-shadow:0 14px 34px rgba(201,168,76,.22)}
.go{padding:15px 30px}
.ghost{border-radius:99px}
.prev{width:50px;height:50px;border-radius:50%;border:1px solid var(--cardb);background:var(--card);display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:0;flex-shrink:0}
.prev::before{content:'';width:10px;height:10px;border-left:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:translateX(2px) rotate(45deg)}
.act{justify-content:center;gap:12px;flex-wrap:wrap}
.prompt{flex:1 1 100%;justify-content:center}
.scene .txt{text-align:center}
.lede{margin-left:auto;margin-right:auto}
.proof{width:fit-content;max-width:42ch;margin:12px auto 0;padding:9px 14px;border:1px solid var(--cardb);border-radius:14px;background:var(--card);font-size:13.5px;text-align:left}
.dev{position:relative}

let skyOn = 'A';
function ciel(hour){
  const h = parseInt(hour, 10);
  let g;
  if(isNaN(h) || h < 7) g = 'radial-gradient(120% 70% at 50% -10%, rgba(74,62,104,.30), transparent 60%)';
  else if(h < 9) g = 'radial-gradient(110% 70% at 15% -5%, rgba(214,132,62,.26), transparent 58%), radial-gradient(90% 60% at 85% 0%, rgba(201,168,76,.12), transparent 60%)';
  else if(h < 16) g = 'radial-gradient(120% 75% at 50% -12%, rgba(212,178,92,.22), transparent 62%)';
  else if(h < 18) g = 'radial-gradient(110% 70% at 85% -5%, rgba(196,128,40,.25), transparent 60%)';
  else g = 'radial-gradient(110% 70% at 70% -8%, rgba(142,47,58,.28), transparent 60%), radial-gradient(80% 50% at 10% 0%, rgba(196,128,40,.12), transparent 60%)';
  const nxt = skyOn === 'A' ? 'B' : 'A';
  const el = $('#sky' + nxt); el.style.background = g; el.classList.add('on'); $('#sky' + skyOn).classList.remove('on'); skyOn = nxt;
}

function jouerSeve(){
  const l = $('#lscr'); if(!l) return;
  l.classList.remove('done'); document.querySelectorAll('.rc').forEach(r => r.classList.remove('on'));
  const sl = $('#sline');
  if(sl){
    const dev = sl.parentElement.getBoundingClientRect(), ph = $('.mini-phone').getBoundingClientRect(), sc = l.getBoundingClientRect();
    const x1 = ph.left - dev.left + ph.width*0.62, y1 = ph.top - dev.top + ph.height*0.42;
    const x2 = sc.left - dev.left + sc.width*0.16, y2 = sc.top - dev.top + sc.height*0.3;
    const d = `M${x1},${y1} C${x1+60},${y1-90} ${x2-90},${y2+60} ${x2},${y2}`;
    const p = $('#spath'); p.setAttribute('d', d); const len = Math.ceil(p.getTotalLength());
    sl.style.setProperty('--len', len); sl.classList.remove('run'); void sl.getBoundingClientRect(); sl.classList.add('run');
  }
  const t0 = calme ? 0 : 1250;
  setTimeout(() => l.classList.add('done'), t0);

}

    <div class="lines">${rows}</div>
    <label class="hors"><span>Compter aussi « retrouver l’info, éviter le déplacement pour rien » : environ ${HORS_H}\u00a0h de plus. Vous seul savez si ça compte chez vous.</span><input type="checkbox" role="switch" data-act="hors" ${S.hors ? 'checked' : ''}></label>
    <p class="hyp">Le barème de base est compté sur mes propres journées en Côte de Nuits. L’ajustement à votre surface et à votre équipe est une estimation.</p>
    <p class="quote">Quinze jours sur vos parcelles, vos surfaces, votre barème. Vous compterez vous-même.</p>
    <a class="cta" href="/essai.html" target="_blank" rel="noopener">Demander mes 15 jours d’essai</a>
    <a class="ghost" href="/?demo=visite" target="_blank" rel="noopener">Ouvrir la vraie appli, librement</a>
    <button class="ghost" data-act="menu">Revoir un chapitre</button>
    <p class="sign"><img src="${IMG['logo']}" alt="">Nicolas Guéret, chef de culture en Côte de Nuits, et l’auteur de Ma Vigne.</p>
  </div></section>`;
}
function majFin(){
  const L = lignes(), tot = totalH();
  const b = $('#bigN'); if(b){ b.textContent = tot; b.dataset.n = tot; }
  const j = $('#jours'); if(j) j.textContent = Math.round(tot/8);
  L.forEach((l, i) => { const e = document.querySelector('.scene.in .ln b[data-i="' + i + '"]'); if(e) e.textContent = '\u2248\u00a0' + l.h + '\u00a0h'; });
}
function compter(){
  const el = $('#bigN'); if(!el) return;
  const n = +el.dataset.n; if(calme){ el.textContent = n; return; }
  const t0 = performance.now(), D = 1100;
  const step = (t) => { const k = Math.min(1, (t - t0)/D), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(n*e); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function rOpen(){
  const n = GROUPES.reduce((t, g) => t + g[1].length, 0);
  return `<section class="scene s-open">
    <div class="op-txt">
      <h1>De la parcelle au registre, sans rien ressaisir.</h1>
      <p class="lede">Trois minutes sur les vrais écrans de l’application. Vous touchez, elle répond.</p>
      <div class="cta-row"><button class="pill" data-act="start">Commencer la démo</button><button class="lien" data-act="menu">Voir les ${n} chapitres</button></div>
    </div>
    <div class="hero" aria-hidden="true">
      <div class="h-laptop"><div class="lscreen"><img src="${IMG['pilotage-auj-apres-pc']}" alt="" decoding="async"></div><div class="lbase"></div></div>
      <div class="h-phone"><img src="${IMG['r-ouv-fait']}" alt="" decoding="async"></div>
      <p class="caption">Captures de la vraie application, sur un domaine de démonstration. Rien n’est enregistré.</p>
    </div>
  </section>`;
}
function rProfil(){
  const o = (p, img, t, x) => `<button class="opt" data-act="persona" data-p="${p}" aria-pressed="${S.persona===p}"><span class="opt-img"><span class="mini"><img src="${IMG[img]}" alt="" decoding="async"></span></span><span class="opt-t"><b>${t}</b><span>${x}</span></span><span class="opt-ck" aria-hidden="true"></span></button>`;
  return `<section class="scene s-prof"><div class="prof-in">
    <p class="hour">6 h 45</p><h1>Quel téléphone prenez-vous en main ?</h1><p class="lede">Au domaine, chacun a le sien. On vous montre ce qu’il y voit, et ce qu’il fait de sa journée.</p>
    <div class="who">${o('gerant','r-ger-accueil','Le gérant','Il prépare, il pilote, il voit tout.')}${o('ouvrier','r-ouv-accueil','L’ouvrier','Sa tâche, ses parcelles, un bouton.')}${o('tractoriste','r-trac-sessions','Le tractoriste','Son chantier, sa machine, son avancement.')}${o('chai','r-chai-accueil','Le maître de chai','Le cuvier, le chai, ce qui presse.')}</div>
    ${curseurs()}
    <button class="go" data-act="go-path" ${S.persona ? '' : 'disabled'}>Commencer la visite</button>
  </div></section>`;
}

// ── Navigation ──
function progres(){
  const p = $('#prog');
  if(S.idx < 0 || S.retour){ p.innerHTML = ''; return; }
  p.innerHTML = S.path.map((id, i) => `<button class="${i < S.idx ? 'done' : (i === S.idx ? 'cur' : '')}" data-act="seg" data-i="${i}" aria-label="Étape ${i+1} sur ${S.path.length}${i===S.idx?', en cours':''}"></button>`).join('');
}
function poser(html, sens){
  const st = $('#stage'), old = st.querySelector('.scene:not(.out)');
  const tmp = document.createElement('div'); tmp.innerHTML = html.trim();
  const el = tmp.firstChild; if(sens < 0) el.classList.add('back');
  st.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  if(old){ old.classList.add('out'); if(sens < 0) old.classList.add('back'); setTimeout(() => old.remove(), 600); }
  return el;
}
function afficher(id, sens, libre){
  const s = SC[id];
  S.cur = id; S.vus.add(id);
  if(s.hour) ciel(s.hour);
  const html = s.type === 'seve' ? rSeve(s) : s.type === 'questions' ? rQuestions(s) : s.type === 'fin' ? rFin(s) : s.type === 'quatre' ? rQuatre(s, libre) : rScreen(id, s, libre);
  poser(html, sens || 1);
  progres();
  if(s.type === 'seve') setTimeout(jouerSeve, 500);
  if(s.type === 'fin') setTimeout(compter, 350);
  initCurs();
}
function ouverture(){ S.idx = -1; S.retour = null; S.cur = 'open'; ciel('6'); progres(); poser(rOpen(), 1); }
function profil(){ S.idx = -1; S.retour = null; S.cur = 'profil'; ciel('6'); progres(); poser(rProfil(), 1); initCurs(); }
function aller(i, sens){ S.retour = null; S.idx = Math.max(0, Math.min(S.path.length - 1, i)); afficher(S.path[S.idx], sens); }
function suivant(){ if(S.idx < S.path.length - 1) aller(S.idx + 1, 1); }
function precedent(){ if(S.retour){ revenir(); return; } if(S.idx > 0) aller(S.idx - 1, -1); else if(S.idx === 0) profil(); }
function chapitre(id){
  fermerMenu();
  if(!S.retour) S.retour = { idx:S.idx, cur:S.cur };
  progres();
  const s = SC[id];
  if(s.type) { afficher(id, 1, true); return; }
  afficher(id, 1, true);
}
function revenir(){
  const r = S.retour; S.retour = null;
  if(!r || r.idx < 0){ if(r && r.cur === 'profil') profil(); else ouverture(); return; }
  S.idx = r.idx; afficher(S.path[S.idx], -1);
}
function ouvrirMenu(){
  const m = $('#menu');
  m.innerHTML = `<div class="menu-in"><div class="menu-top"><h2>Tous les chapitres</h2><button class="x" data-act="close" aria-label="Fermer">Fermer</button></div>
    <p class="lede">Chaque écran est réel. Rien n’est enregistré.</p>
    ${GROUPES.map(([g, ids]) => `<p class="grp">${esc(g)}</p><div class="grid">${ids.map(id => { const s = SC[id]; const im = s.type === 'seve' ? 'pilotage-auj-apres-pc' : s.img; return `<button class="it" data-act="ch" data-id="${id}"><img src="${IMG['t-' + im] || IMG[im] || ''}" alt="" loading="lazy"><b>${esc(s.title)}</b><span class="${S.vus.has(id) ? 'vu' : ''}">${S.vus.has(id) ? 'Déjà vu' : esc((s.lede||'').split('. ')[0])}</span></button>`; }).join('')}</div>`).join('')}
  </div>`;
  m.classList.add('on'); const x = m.querySelector('.x'); if(x) x.focus();
}
function fermerMenu(){ $('#menu').classList.remove('on'); }

// ── Gestes ──
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'start') profil();
  else if(a === 'home') ouverture();
  else if(a === 'persona'){ S.persona = b.dataset.p; document.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o === b)); const g = document.querySelector('[data-act="go-path"]'); if(g) g.disabled = false; }
  else if(a === 'chip'){ S[b.dataset.k] = b.dataset.v; b.parentElement.querySelectorAll('button').forEach(c => c.setAttribute('aria-pressed', c === b)); if(S.cur === 'fin' && !S.retour){ const sc = document.querySelector('.scene.in .fin-in'); const y = document.querySelector('.scene.in').scrollTop; const st = $('#stage'); const old = st.querySelector('.scene.in'); const tmp = document.createElement('div'); tmp.innerHTML = rFin(SC.fin).trim(); const el = tmp.firstChild; el.classList.add('in'); el.style.transition = 'none'; st.replaceChild(el, old); el.scrollTop = y; compter(); } }
  else if(a === 'go-path'){ S.path = PATHS[S.persona] || PATHS.gerant; aller(0, 1); }
  else if(a === 'prendre'){ S.persona = b.dataset.p; S.path = PATHS[S.persona]; S.retour = null; aller(0, 1); }
  else if(a === 'next') suivant();
  else if(a === 'prev') precedent();
  else if(a === 'seg') aller(+b.dataset.i, +b.dataset.i < S.idx ? -1 : 1);
  else if(a === 'menu') ouvrirMenu();
  else if(a === 'close') fermerMenu();
  else if(a === 'ch' || a === 'voirch') chapitre(b.dataset.id);
  else if(a === 'retour') revenir();
  else if(a === 'replay') jouerSeve();
  else if(a === 'hot' || a === 'voir') geste(e, a === 'hot');
});
document.addEventListener('change', (e) => {
  if(e.target.matches('[data-act="hors"]')){ S.hors = e.target.checked; majFin(); }
});
document.addEventListener('input', (e) => {
  const i = e.target; if(!i.matches('[data-act="slide"]')) return;
  S[i.dataset.k] = +i.value;
  i.style.setProperty('--p', ((i.value - i.min)/(i.max - i.min)*100) + '%');
  const o = i.parentElement.querySelector('output'); if(o) o.textContent = i.dataset.k === 'ha' ? fmtHa(S.ha) : S.eq;
  if(S.cur === 'fin') majFin();
});
function geste(e, touche){
  const sc = document.querySelector('.scene.in .screen'); if(!sc || sc.classList.contains('done')) return;
  const s = SC[S.cur]; if(!s || !s.hot) return;
  if(touche){
    const r = sc.getBoundingClientRect(), rp = document.createElement('span'); rp.className = 'ripple';
    rp.style.left = (e.clientX - r.left) + 'px'; rp.style.top = (e.clientY - r.top) + 'px'; sc.appendChild(rp); setTimeout(() => rp.remove(), 800);
    if(navigator.vibrate) { try{ navigator.vibrate(12); }catch(_){} }
  }
  sc.classList.add('done');
  const l = $('#lede'); if(l){ l.style.opacity = 0; setTimeout(() => { l.textContent = s.hot.lede; l.style.opacity = 1; }, 280); }
  const act = document.querySelector('.scene.in .act');
  if(act) act.outerHTML = `<div class="act">${S.idx > 0 && !S.retour ? '<button class="prev" data-act="prev" aria-label="Retour">Retour</button>' : ''}<button class="go" data-act="${S.retour ? 'retour' : 'next'}">${S.retour ? 'Revenir' : 'Continuer'}</button></div>`;
}
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ fermerMenu(); return; }
  if($('#menu').classList.contains('on')) return;
  if(e.target.closest('input,textarea')) return;
  if(e.key === 'ArrowRight'){ if(S.cur === 'open') profil(); else if(S.idx >= 0 && !document.querySelector('.scene.in .hot')) suivant(); }
  if(e.key === 'ArrowLeft') precedent();
});
let x0 = null, y0 = null;
$('#stage').addEventListener('touchstart', (e) => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive:true });
$('#stage').addEventListener('touchend', (e) => {
  if(x0 === null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
  if(Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)*0.7) return;
  if(dx < 0 && S.idx >= 0 && !S.retour && !document.querySelector('.scene.in .hot:not([style*="display: none"])') ) { if(!(document.querySelector('.scene.in .screen') && !document.querySelector('.scene.in .screen.done') && SC[S.cur].hot)) suivant(); }
  if(dx > 0) precedent();
}, { passive:true });
addEventListener('resize', () => { if(S.cur === 'seve' && !S.retour){ clearTimeout(window.__rs); window.__rs = setTimeout(() => afficher('seve', 1), 250); } });

ouverture();
})();
</script>
</body>
</html>
