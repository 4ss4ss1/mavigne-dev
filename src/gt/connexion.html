<!-- ★★ GT-1 (§249) — fragment de gt.html SEULEMENT, inséré par scripts/mv-gt-page.mjs à la place du repère
     « MV-GT:CONNEXION » d'index.html. L'appli des clients (index.html) ne contient pas ce balisage. -->
  <!-- ══ Panneau login GUERETTECH — 5 taps logo ══ -->
  <div id="gt-login-panel" style="display:none;width:100%;margin-top:20px">
    <div style="background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:16px;padding:20px 18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#8B5CF6,#6D28D9);display:flex;align-items:center;justify-content:center;font-size:13px"><svg class="mv-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ic-raisin"></use></svg></div>
          <span style="color:#C4B5FD;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Admin GUERETTECH</span>
        </div>
        <button onclick="hideGTLoginPanel()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:5px 10px;color:rgba(255,255,255,0.4);font-size:var(--pt-micro,12px);cursor:pointer"><svg class="mv-ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ic-croix"></use></svg></button>
      </div>
      <div class="login-label" style="color:rgba(196,181,253,0.7)">Email</div>
      <input type="email" id="gt-login-email" class="login-input" placeholder="Email" autocomplete="off" autocorrect="off" autocapitalize="none" style="border-color:rgba(139,92,246,0.3)">
      <div class="login-label" style="color:rgba(196,181,253,0.7);margin-top:10px">Mot de passe</div>
      <input type="password" id="gt-login-pwd" class="login-input" placeholder="••••••••" autocomplete="current-password" style="border-color:rgba(139,92,246,0.3)">
      <div id="gt-login-error" style="color:#FF8A80;font-size:var(--pt-micro,12px);margin-top:-8px;margin-bottom:10px;display:none"></div>
      <button id="gt-login-btn" class="login-btn" onclick="confirmGTLogin()" style="background:linear-gradient(135deg,#7C3AED,#5B21B6);border:none;margin-top:14px">Connexion</button>

      <!-- SEC-GT/2 — second facteur. autocomplete="one-time-code" fait proposer
           le code par iOS depuis la notification, sans ouvrir la boîte mail. -->
      <div id="gt-otp-box" style="display:none;margin-top:16px;border-top:1px solid rgba(139,92,246,0.2);padding-top:14px">
        <div class="login-label" style="color:rgba(196,181,253,0.7)">Code re&#231;u par e-mail</div>
        <input type="text" id="gt-otp-code" class="login-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="border-color:rgba(139,92,246,0.3);letter-spacing:.35em;text-align:center;font-family:monospace">
        <div id="gt-otp-info" style="color:rgba(196,181,253,0.55);font-size:var(--pt-lbl,11.5px);margin-top:-4px;margin-bottom:6px"></div>
        <button id="gt-otp-btn" class="login-btn" onclick="confirmGTOtp()" style="background:linear-gradient(135deg,#7C3AED,#5B21B6);border:none;margin-top:8px">Ouvrir la session</button>
        <button onclick="gtOtpResend()" style="width:100%;background:none;border:none;color:rgba(196,181,253,0.45);font-size:var(--pt-lbl,11.5px);cursor:pointer;font-family:Outfit,sans-serif;padding:9px 0 0">Renvoyer un code</button>
      </div>
    </div>
  </div>
