# ============================================================================
#  MA VIGNE — CI
#  --------------------------------------------------------------------------
#  Tourne a CHAQUE push et a chaque pull request. Ce que faisait la discipline
#  ("penser a lancer npm run check avant de pousser") devient mecanique.
#
#  ⚠️ CE WORKFLOW NE DEPLOIE RIEN, JAMAIS.
#     Deployer reste une decision : bump APP + SW, WHATS_NEW redige, et l'ordre
#     functions -> backfill -> hosting -> rules. La CI allume le feu vert ou
#     rouge, elle ne touche pas au levier. Aucun secret n'est necessaire ici.
#
#  Trois jobs en parallele pour que le rouge soit lisible d'un coup d'oeil :
#    · controles : la liste unique -> build -> smoke    (LISTE-1, §190)
#    · e2e       : les 10 pages, login DOM reel           (~5 min)
#    · rules     : firestore.rules sur l'emulateur        (RULES-1, §189)
# ============================================================================

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions

# Un nouveau push sur la meme branche annule le run precedent : pas de file
# d'attente quand on pousse trois commits d'affilee.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  controles:
    name: Preflight · ESLint · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ⚠️ fetch-depth 0 — sans l'historique complet, `git log -1 -- <fichier>`
          # rend la date de HEAD pour TOUS les fichiers : mv-sitemap.mjs ne peut
          # plus dater les pages et se met en veille (13/09, §122b).
          fetch-depth: 0

      - name: Node 22 (meme version que les Cloud Functions)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      # ★★★ LISTE-1 (§190) — UNE SEULE LISTE, JOUEE UNE SEULE FOIS.
      # Tous les controles vivent dans scripts/mv-harnais-liste.mjs, dans l'ordre
      # de `npm run check` (c'est la MEME liste : check = prebuild = cette etape).
      # Avant ce lot, 34 etapes rejouaient ici 70 controles a la main, puis
      # `npm run build` relancait les 142 via prebuild : tout tournait deux fois.
      # Les raisons d'etre ecrites au-dessus de chaque ancienne etape sont
      # reprises mot pour mot dans GROUPES (mv-harnais-liste.mjs).
      # --continuer : on joue TOUT et le resume final liste chaque rouge, avec
      # la raison d'etre de son groupe — l'equivalent des etapes nommees.
      - name: Controles — la liste unique (mv-harnais-liste.mjs)
        run: node scripts/mv-lanceur.mjs --continuer

      # Vite + inject-precache (postbuild, idempotent).
      # ⚠️ --ignore-scripts : les controles viennent de tourner a l'etape
      # precedente ; sans ce drapeau, `prebuild` les relancerait tous (npm ne
      # saute que les hooks pre/post, le script `build` lui-meme tourne).
      - name: Build
        run: npm run build --ignore-scripts

      - name: Chromium pour le smoke
        run: npx playwright install --with-deps chromium

      # L'app boote-t-elle vraiment ? Le type de bug que node --check ne voit pas.
      - name: Smoke — l'app demarre sans exception
        run: npm run test:smoke

      # Utile quand le smoke tombe : on recupere le bundle exact qui a echoue.
      - name: Garder le build en cas d'echec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-echec
          path: dist/
          retention-days: 5

  # ==========================================================================
  e2e:
    name: E2E — 10 pages, login DOM reel
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ⚠️ fetch-depth 0 — sans l'historique complet, `git log -1 -- <fichier>`
          # rend la date de HEAD pour TOUS les fichiers : mv-sitemap.mjs ne peut
          # plus dater les pages et se met en veille (13/09, §122b).
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Chromium pour le e2e
        run: npx playwright install --with-deps chromium

      # Reseau Firebase coupe, donnees injectees, aucun contact avec la prod.
      # ⚠️ Ce test charge Leaflet depuis unpkg : une panne d'unpkg peut le faire
      #    rougir sans qu'aucune ligne de code soit en cause. Dans ce cas,
      #    "Re-run failed jobs" dans l'onglet Actions.
      - name: E2E local (donnees injectees)
        run: npm run test:e2e

  # ==========================================================================
  # ★★★ RULES-1 (§189) — firestore.rules EXECUTEES par le vrai moteur.
  # Tous les autres controles LISENT le fichier de regles comme du texte : ils
  # voient qu'une ligne existe, jamais ce que le moteur en fait. Ici, 53 requetes
  # reelles sur l'emulateur (un membre de A ne lit jamais B, fiche Inactive
  # dehors, ro, admin-only, paie, demo, session GT), puis 12 contre-epreuves :
  # chaque faute est posee sur une copie des regles et le cas vise doit rougir.
  # ⚠️ Job a part : il lui faut Java (l'emulateur est un .jar) et firebase-tools,
  #    que le reste de la CI n'installe pas. Il ne deploie rien, ne lit aucun
  #    secret : projet `demo-mv-rules`, qui n'atteint jamais un vrai projet.
  rules:
    name: Regles Firestore — emulateur (RULES-1)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # firebase-tools 14 exige Java 21 pour les emulateurs.
      - name: Java 21 (emulateur Firestore)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer les dependances
        run: npm ci

      - name: Regles Firestore — harnais + contre-epreuves
        run: npm run test:rules
