# ============================================================================
#  MA VIGNE — CI
#  --------------------------------------------------------------------------
#  Tourne a CHAQUE push et a chaque pull request. Ce que faisait la discipline
#  ("penser a lancer npm run check avant de pousser") devient mecanique.
#
#  ⚠️ CE WORKFLOW NE DEPLOIE RIEN, JAMAIS.
#     Deployer reste une decision : bump APP + SW, WHATS_NEW redige, et l'ordre
#     functions -> backfill -> hosting -> rules. La CI allume le feu vert ou
#     rouge, elle ne touche pas au levier. Aucun secret n'est necessaire ici.
#
#  Deux jobs en parallele pour que le rouge soit lisible d'un coup d'oeil :
#    · controles : preflight -> lint -> build -> smoke   (~3 min)
#    · e2e       : les 10 pages, login DOM reel           (~5 min)
# ============================================================================

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions

# Un nouveau push sur la meme branche annule le run precedent : pas de file
# d'attente quand on pousse trois commits d'affilee.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  controles:
    name: Preflight · ESLint · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Node 22 (meme version que les Cloud Functions)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      # C1–C22 : le filet anti-regression. Lecture seule, ~1 s.
      # (npm run build le relance en prebuild ; ici c'est pour echouer VITE
      #  et sur une etape NOMMEE, avant les 50 s de build.)
      - name: Preflight (C1–C22)
        run: node scripts/preflight.mjs

      # Cliquet : bloque toute erreur NOUVELLE, tolere le plafond documente
      # dans scripts/lint-cliquet.mjs.
      - name: ESLint — cliquet anti-regression
        run: node scripts/lint-cliquet.mjs

      # Cliquet de vocabulaire : « pause dejeuner » est banni du PLANNING (le mot
      # designe en droit un droit du salarie). Il etait ecrit depuis le 11/08 mais
      # AUCUN appelant ne l'executait — ni npm run lint, ni la CI. Branche ici.
      - name: Vocabulaire — presence / coupure / heures dues
        run: node scripts/lint-vocabulaire.mjs

      # Le guide public est ASSEMBLE depuis guide/*.html par un script hors build.
      # Vecu le 13/08 : les sources avaient ete enrichies sans regenerer, et la
      # page deployee est restee en retard sans que rien ne le signale.
      - name: Guide — la page deployee est en phase avec ses sources
        run: node scripts/build-guide.mjs --check

      # Le journal des nouveautes s'EXECUTE au lieu de se relire, et les
      # documents ne doivent pas s'echapper de la charte MV_DOC (cliquet).
      - name: Journal des nouveautes + chartes de document
        run: |
          node scripts/mv-whatsnew-check.mjs
          node scripts/mv-chartes-doc.mjs

      # Harnais des documents : modules reels charges dans Node, aucun reseau.
      - name: Harnais — les six documents
        run: |
          node scripts/mv-harnais-cuvdoc.mjs
          node scripts/mv-harnais-vignoble.mjs
          node scripts/mv-harnais-releve.mjs
          node scripts/mv-harnais-entretien.mjs

      # Deux cliquets du Pilotage. L'echelle : 28 tailles de texte ecrites a la
      # main vivent desormais sur onze pas nommes — sans ce controle, la 29e
      # revient au premier ecran ajoute et rien ne rougit. La pastille : aucune
      # ne doit ouvrir une feuille vide, aucune fiche ne doit rester orpheline,
      # et l'ecouteur doit garder son stopPropagation (sans lui, ouvrir la fiche
      # replie la tuile qu'on cherche a comprendre).
      - name: Harnais — l'echelle de texte et la pastille « i »
        run: |
          node scripts/mv-harnais-echelle.mjs
          node scripts/mv-harnais-info.mjs

      # Vite + inject-precache (postbuild, idempotent).
      - name: Build
        run: npm run build

      - name: Chromium pour le smoke
        run: npx playwright install --with-deps chromium

      # L'app boote-t-elle vraiment ? Le type de bug que node --check ne voit pas.
      - name: Smoke — l'app demarre sans exception
        run: npm run test:smoke

      # Utile quand le smoke tombe : on recupere le bundle exact qui a echoue.
      - name: Garder le build en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dist-echec
          path: dist/
          retention-days: 5

  # ==========================================================================
  e2e:
    name: E2E — 10 pages, login DOM reel
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Chromium pour le e2e
        run: npx playwright install --with-deps chromium

      # Reseau Firebase coupe, donnees injectees, aucun contact avec la prod.
      # ⚠️ Ce test charge Leaflet depuis unpkg : une panne d'unpkg peut le faire
      #    rougir sans qu'aucune ligne de code soit en cause. Dans ce cas,
      #    "Re-run failed jobs" dans l'onglet Actions.
      - name: E2E local (donnees injectees)
        run: npm run test:e2e
